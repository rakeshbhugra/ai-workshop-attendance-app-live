[project]
name = "attendance"
version = "0.1.0"
description = "Attendance — FastAPI backend (layered / ports-and-adapters architecture)"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.118,<0.200",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.16.0",
    # asyncpg for Postgres (dev/prod), aiosqlite for the test suite and for a
    # zero-config first run. Both are small; keeping both means `git clone &&
    # uv run attendance` works before anyone starts a container.
    "asyncpg>=0.30.0",
    "aiosqlite>=0.21.0",
    # SQLAlchemy's async layer runs the sync ORM on greenlets; it is a hard
    # runtime requirement, not an optional extra.
    "greenlet>=3.1.0",
    "structlog>=25.1.0",
    "boto3>=1.37.0",
    # FastAPI needs this to parse multipart bodies (the file upload endpoint).
    "python-multipart>=0.0.20",
    # Sign-in: httpx talks to Google, itsdangerous signs the session cookie.
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "debugpy>=1.8.0",
    "pytest-benchmark>=5.1.0",
]
lint = [
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "boto3-stubs[s3]>=1.37.0",
]

[project.scripts]
attendance = "attendance.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attendance"]

# ── ruff: lint + format ──────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade — keep the codebase on modern syntax
    "B",    # bugbear — the real-bug subset
    "SIM",  # simplifiable code
    "RUF",  # ruff's own rules
    "ASYNC",# async antipatterns (blocking calls in async defs)
    "S",    # bandit security rules
    "BLE",  # blind excepts
    "C4",   # comprehension rewrites
    "PTH",  # prefer pathlib over os.path
]
ignore = [
    # os.path is the clearer choice in spa.py's containment check, and pathlib
    # buys nothing there.
    "PTH118", "PTH110", "PTH112", "PTH100",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom deliberately puts these calls in argument
# defaults; B008 would flag every route in the app.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
# Tests assert with bare asserts (S101) and use hardcoded throwaway values.
"tests/**" = ["S101", "S105", "S106"]

# ── mypy: strict, because this is new code ───────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Tests trade a little type rigour for readability.
module = "tests.*"
disallow_untyped_defs = false

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-q",
    "--strict-markers",
    "--cov=src/attendance",
    "--cov-report=term-missing",
    # A ratchet, not a target. Raise it as coverage grows; never lower it to
    # make a build pass.
    "--cov-fail-under=80",
    # Benchmarks run as ordinary tests in the normal suite: the code is executed
    # once (so it can't silently rot) but not timed, because timings on a shared
    # CI runner are noise. `make bench` re-runs them with timing enabled.
    "--benchmark-disable",
]
markers = [
    "integration: needs a real database (deselect with -m 'not integration')",
    "benchmark: a timed micro-benchmark (run with `make bench`)",
]

[tool.coverage.run]
branch = true
omit = ["src/attendance/main.py", "*/alembic/*"]
