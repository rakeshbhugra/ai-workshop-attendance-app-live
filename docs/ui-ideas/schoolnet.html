<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schoolnet · Attendance Management</title>
<style>
@font-face{font-family:Lato;src:url('assets/lato-regular.woff2') format('woff2');font-weight:400;font-display:swap}@font-face{font-family:Lato;src:url('assets/lato-bold.woff2') format('woff2');font-weight:700;font-display:swap}@font-face{font-family:Poppins;src:url('assets/poppins-semibold.woff2') format('woff2');font-weight:600;font-display:swap}
:root{--green:#0aa34f;--action:#07833f;--blue:#007cdc;--blue-text:#0068b8;--bg:#f9fafc;--ink:#333;--muted:#626262;--border:#e2e7ec;--soft:#f3fff9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Lato,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button,a,input,select,textarea{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue-text);outline-offset:3px}button:disabled{opacity:.5;cursor:not-allowed}a{color:var(--blue-text)}.topbar{height:88px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:18px 32px;gap:24px}.logo{width:190px;height:auto;display:block}.top-left{display:flex;align-items:center;gap:24px}.divider{width:1px;height:30px;background:var(--border)}.top-title{font-size:18px;font-weight:700;color:#1d1d1d}.profile{display:flex;align-items:center;gap:12px}.avatar{display:grid;place-items:center;width:40px;height:40px;background:#e9f6ef;color:var(--action);border-radius:50%;font-weight:700}.muted{color:var(--muted)}.profile small{display:block;color:var(--muted);font-size:14px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 88px)}.sidebar{background:#fff;border-right:1px solid var(--border);padding:24px 14px;position:sticky;top:88px;height:calc(100vh - 88px);overflow-y:auto;display:flex;flex-direction:column}.module-title{background:var(--blue);color:#fff;font-size:18px;font-weight:700;margin:-24px -14px 18px;padding:21px 22px}.nav-item{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:transparent;border:0;border-radius:7px;padding:14px 16px;color:var(--muted);font-size:16px;margin-bottom:4px}.nav-item svg{width:19px;height:19px;flex-shrink:0}.nav-item .chevron{margin-left:auto;width:15px;height:15px}.nav-item:hover{background:var(--bg);color:var(--action)}.nav-item.active{background:var(--soft);color:var(--action);font-weight:700;box-shadow:inset 3px 0 var(--green)}.nav-item.group{background:#f2f4f6;color:var(--ink)}.subnav{padding:4px 0 8px 17px}.subnav .nav-item{padding-left:25px}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding:18px 10px 0;font-size:14px}.sidebar-bottom a{display:block;margin-bottom:9px;text-decoration:none}.main{padding:32px 40px 48px;max-width:1500px;width:100%;margin:0 auto}.breadcrumb{font-size:14px;color:var(--muted);margin-bottom:23px}.breadcrumb span{color:var(--blue-text)}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}h1{font-size:32px;line-height:1.25;letter-spacing:-.01em;color:#1d1d1d;margin:0 0 10px;font-weight:700}h1 em{font-style:normal;color:var(--action)}h2{font-size:21px;letter-spacing:-.01em;margin:0;font-weight:700}p{margin:0;color:var(--muted)}.btn{border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);padding:11px 18px;font-family:Poppins,sans-serif;font-weight:600;font-size:16px;display:inline-flex;justify-content:center;align-items:center;gap:8px;text-decoration:none}.btn.primary{background:var(--action);border-color:var(--action);color:#fff}.btn.secondary{background:var(--blue-text);border-color:var(--blue-text);color:#fff}.btn:hover{filter:brightness(.96)}.banner{display:flex;align-items:center;justify-content:space-between;gap:20px;border:1px solid #d9eade;background:var(--soft);border-radius:10px;padding:22px 24px}.banner select{max-width:380px}.tag{color:var(--action);font-size:14px;font-weight:700}.banner h2{margin:4px 0 7px}.banner p{font-size:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:28px 0;background:#fff;border:1px solid var(--border);border-radius:10px;padding:22px 0}.stat{padding:0 24px;border-right:1px dotted #8dc3e9}.stat:last-child{border:0}.stat b{font-family:Poppins,sans-serif;font-size:30px;font-weight:600;display:block;color:var(--blue-text);line-height:1.3;margin-bottom:6px}.stat span{font-size:16px;color:var(--muted)}.panel{border:1px solid var(--border);border-radius:10px;background:#fff;padding:24px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:20px 0}.search{width:320px;max-width:100%;border:1px solid var(--border);border-radius:8px;padding:11px 14px;background:#fff}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:1px solid var(--border);border-radius:7px;padding:9px 13px;color:var(--muted);background:#fff}.filter.active{background:#edf6ff;color:var(--blue-text);border-color:#8dc3e9}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th{background:var(--bg);font-size:16px;font-weight:700;color:var(--muted);padding:14px 16px;white-space:nowrap}td{border-top:1px solid var(--border);padding:17px 16px;font-size:16px}.person{display:flex;align-items:center;gap:12px}.person .avatar{width:36px;height:36px;font-size:14px;flex-shrink:0}.person small{display:block;color:var(--muted);font-size:14px;margin-top:4px}.badge{display:inline-block;padding:5px 11px;font-size:14px;border-radius:6px;background:#f1f3f6;color:#626262;white-space:nowrap}.badge.present{background:#eaf8ef;color:#176c3a}.badge.absent{background:#fcefeb;color:#9b3828}.mark{border:1px solid var(--border);padding:8px 10px;border-radius:6px;background:#fff;color:var(--muted);font-size:16px;margin:2px}.mark.selected[data-status=present]{color:#176c3a;background:#eaf8ef;border-color:#82ba97}.mark.selected[data-status=absent]{color:#9b3828;background:#fcefeb;border-color:#d9aaa1}.actions{white-space:nowrap}.note{font-size:14px;color:var(--muted);margin-top:20px}.row-action{border:0;background:transparent;color:var(--blue-text);text-decoration:underline;text-underline-offset:4px;padding:9px;font-size:16px}.empty{text-align:center;padding:32px;color:var(--muted)}.form{max-width:680px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:22px}.field{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}label{font-weight:700}input,select,textarea{border:1px solid #ccd4dc;border-radius:8px;padding:12px 14px;color:var(--ink);background:#fff;min-width:0}textarea{resize:vertical;min-height:120px}.form-actions{display:flex;gap:12px;align-items:center;margin-top:12px}.error{color:#9b3828;margin-bottom:16px}.class-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:24px}.class-card{padding:24px;border:1px solid var(--border);border-radius:10px;background:#fff}.class-card h2{margin:12px 0}.class-card p{margin-bottom:20px}.class-card .btn{margin-top:10px}.draft{padding:18px 0;border-top:1px solid var(--border)}.draft strong{display:block;margin-bottom:8px}.draft p{white-space:pre-wrap;overflow-wrap:anywhere}.draft small{display:block;color:var(--muted);margin-bottom:8px}.mobile-toggle{display:none;background:transparent;border:0;padding:10px;color:var(--ink)}.mobile-toggle svg{width:24px;height:24px}.overlay{display:none}.toast{position:fixed;bottom:24px;right:24px;background:#1d1d1d;color:#fff;padding:15px 24px;border-radius:8px;z-index:50;max-width:calc(100vw - 32px)}[hidden]{display:none!important}.demo{font-size:14px;color:var(--muted);padding:12px 40px;background:#fff;border-bottom:1px solid var(--border)}.demo strong{color:var(--blue-text)}
@media(max-width:1100px){.layout{grid-template-columns:250px minmax(0,1fr)}.main{padding:28px 24px}.toolbar,.heading{flex-wrap:wrap}.stats .stat{padding:0 16px}.class-grid{grid-template-columns:1fr}.sidebar{padding-left:10px;padding-right:10px}.module-title{margin-left:-10px;margin-right:-10px}.demo{padding:12px 24px}}
@media(max-width:800px){.topbar{height:76px;padding:16px;gap:8px}.logo{width:150px}.top-left{gap:10px}.top-title,.divider,.profile div:last-child{display:none}.mobile-toggle{display:block}.layout{display:block;min-height:calc(100vh - 76px)}.sidebar{position:fixed;top:76px;left:0;bottom:0;height:calc(100dvh - 76px);width:280px;z-index:30;transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:76px 0 0;background:#0006;z-index:25}.main{padding:24px 16px}.demo{padding:12px 16px}.heading{margin-bottom:22px}h1{font-size:28px}.banner{padding:20px;flex-direction:column;align-items:stretch}.banner select{width:100%;max-width:none}.stats{grid-template-columns:repeat(2,1fr);gap:20px;padding:20px 0}.stat:nth-child(2){border:0}.stat b{font-size:26px}.panel{padding:18px 14px}.panel-head{flex-wrap:wrap}.toolbar{align-items:stretch}.search{width:100%}.fields{grid-template-columns:1fr;gap:0}.btn{padding:10px 16px}.form-actions{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar"><div class="top-left"><button class="mobile-toggle" id="mobile-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar"></button><img class="logo" src="assets/schoolnet-logo.png" alt="Schoolnet: Learning for Life"><span class="divider"></span><span class="top-title">Attendance Management</span></div><div class="profile"><div class="avatar">RB</div><div><strong>Rakesh Bhugra</strong><small>Workshop organizer</small></div></div></header>
<div class="demo"><strong>UI preview</strong> · Sample data, temporary changes. Mails supports drafts only.</div>
<div class="overlay" id="overlay"></div>
<div class="layout"><aside class="sidebar" id="sidebar" aria-label="Main navigation"><div class="module-title">Attendance Management</div><nav id="navigation"></nav><div class="sidebar-bottom"><a href="index.html">← Five UI ideas</a><a href="../workshop-attendance-prd.html">Product requirements ↗</a><span>Workshop attendance · Schoolnet style</span></div></aside><main class="main" id="main" tabindex="-1"></main></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const paths={attendance:'<path d="M8 4H4v16h16V10M8 12l4 4L21 5"/>',classes:'<rect x="3" y="6" width="18" height="15" rx="2"/><path d="M8 6V3h8v3M3 12h18M10 12v3h4v-3"/>',students:'<circle cx="9" cy="7" r="3"/><circle cx="18" cy="8" r="2"/><path d="M3 21v-4a6 6 0 0 1 12 0v4M16 14a5 5 0 0 1 5 5v2"/>',add:'<path d="M12 4v16M4 12h16"/>',active:'<circle cx="8" cy="7" r="3"/><path d="M2 21v-4a6 6 0 0 1 11-3M15 16l3 3 5-7"/>',archive:'<rect x="3" y="3" width="18" height="5" rx="1"/><path d="M5 8v13h14V8M9 12h6"/>',admin:'<path d="M3 9l9-6 9 6M5 21h14M6 10v7M18 10v7"/><circle cx="12" cy="12" r="2"/><path d="M8 19a4 4 0 0 1 8 0"/>',reports:'<path d="M4 3v18h17M8 16v-4M13 16V8M18 16v-6"/>',mails:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 6l9 7 9-7"/>',chevron:'<path d="M9 5l7 7-7 7"/>',down:'<path d="M5 9l7 7 7-7"/>',menu:'<path d="M3 6h18M3 12h18M3 18h18"/>'};
function icon(name,cls=''){return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]}</svg>`}
const names=[['Aarav Mehta','aarav@example.com','present'],['Diya Shah','diya@example.com','present'],['Ishaan Rao','ishaan@example.com','unmarked'],['Kavya Iyer','kavya@example.com','unmarked'],['Neha Kapoor','neha@example.com','absent'],['Rohan Joshi','rohan@example.com','unmarked']];
let students=names.map((p,i)=>({id:i+1,name:p[0],email:p[1],archived:false}));students.push({id:7,name:'Ananya Sen',email:'ananya@example.com',archived:true});
let classes=[{id:1,title:'AI fundamentals',date:'2026-10-09'}],selectedClass=1;
let attendance={1:Object.fromEntries(names.map((p,i)=>[i+1,p[2]]))},drafts=[],page='attendance',groupOpen=true,query='',filter='all',timer;
const labels={attendance:'Fill Attendance',classes:'Classes',add:'Add Student',active:'Active Students',archive:'Archive Students',admin:'Admin View',reports:'My Class Reports',mails:'Mails'};
const main=document.querySelector('#main');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(n){return n.trim().split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase()}
function active(){return students.filter(s=>!s.archived)}
function status(s){return attendance[selectedClass][s.id]||'unmarked'}
function person(s){return `<div class="person"><span class="avatar">${esc(initials(s.name))}</span><div><strong>${esc(s.name)}</strong><small>${esc(s.email)}</small></div></div>`}
function navButton(p){return `<button class="nav-item ${page===p?'active':''}" data-page="${p}" ${page===p?'aria-current="page"':''}>${icon(p)}<span>${labels[p]}</span>${['add','active','archive'].includes(p)?'':icon('chevron','chevron')}</button>`}
function nav(){document.querySelector('#navigation').innerHTML=navButton('attendance')+navButton('classes')+`<button class="nav-item group" id="student-group" aria-expanded="${groupOpen}" aria-controls="student-subnav">${icon('students')}<span>Student Details</span>${icon(groupOpen?'down':'chevron','chevron')}</button><div class="subnav" id="student-subnav" ${groupOpen?'':'hidden'}>${['add','active','archive'].map(navButton).join('')}</div>`+['admin','reports','mails'].map(navButton).join('')}
function heading(title,description,action=''){return `<div class="heading"><div><h1>${title}</h1><p>${description}</p></div>${action}</div>`}
function classSelect(){return `<select id="class-select" aria-label="Select workshop">${classes.map(c=>`<option value="${c.id}" ${selectedClass===c.id?'selected':''}>${esc(c.title)} · ${esc(c.date)}</option>`).join('')}</select>`}
function stats(){return `<div class="stats">${[['Registered',active().length],['Present',active().filter(s=>status(s)==='present').length],['Absent',active().filter(s=>status(s)==='absent').length],['Unmarked',active().filter(s=>status(s)==='unmarked').length]].map(([n,v])=>`<div class="stat"><b>${v}</b><span>${n}</span></div>`).join('')}</div>`}
function search(){return `<input class="search" type="search" aria-label="Search students" placeholder="Search student name or email" value="${esc(query)}">`}
function filtered(list){return list.filter(s=>(s.name+' '+s.email).toLowerCase().includes(query.toLowerCase()))}
function fillAttendance(){const list=filtered(active()).filter(s=>filter==='all'||status(s)===filter);return heading('Fill <em>Attendance</em>','A clear record of everyone in your workshop.','<button class="btn primary" data-export>↓ Export CSV</button>')+`<div class="banner"><div><span class="tag">Workshop attendance</span><h2>${esc(classes.find(c=>c.id===selectedClass).title)}</h2><p>Mark students present or absent. Tap a selected status to clear it.</p></div>${classSelect()}</div>`+stats()+`<div class="panel"><div class="panel-head"><h2>Student roster</h2><span class="muted">${list.length} students shown</span></div><div class="toolbar">${search()}<div class="filters">${['all','present','absent','unmarked'].map(f=>`<button class="filter ${filter===f?'active':''}" data-filter="${f}" aria-pressed="${filter===f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Status</th><th>Attendance</th></tr></thead><tbody>${list.map(s=>`<tr><td>${person(s)}</td><td><span class="badge ${status(s)}">${status(s)}</span></td><td class="actions">${['present','absent'].map(v=>`<button class="mark ${status(s)===v?'selected':''}" data-id="${s.id}" data-status="${v}" aria-label="Mark ${esc(s.name)} ${v}" aria-pressed="${status(s)===v}">${v==='present'?'✓ Present':'× Absent'}</button>`).join('')}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">No students found.</td></tr>'}</tbody></table></div></div>`}
function studentForm(){return heading('Add <em>Student</em>','Add a student to the active roster for workshop attendance.')+`<form class="panel form" id="student-form"><h2 style="margin-bottom:24px">Student details</h2><div class="fields"><div class="field"><label for="student-name">Full name</label><input id="student-name" name="name" required maxlength="100" placeholder="e.g. Aarav Mehta"></div><div class="field"><label for="student-email">Email address</label><input id="student-email" name="email" type="email" required maxlength="254" placeholder="e.g. aarav@example.com"></div></div><p class="error" id="form-error" role="alert" hidden></p><p>New students start as Unmarked. Email addresses must be unique across active and archived students.</p><div class="form-actions"><button class="btn primary" type="submit">Add Student</button><button class="btn" type="button" data-page="active">View active students</button></div></form>`}
function studentList(archived){const list=filtered(students.filter(s=>s.archived===archived));return heading(archived?'Archive <em>Students</em>':'Active <em>Students</em>',archived?'Archived students are excluded from attendance. Restore them when needed.':'Manage the students available for workshop attendance.','<button class="btn primary" data-page="add">＋ Add Student</button>')+`<div class="panel"><div class="toolbar">${search()}<span class="muted">${list.length} students</span></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Roster status</th><th>Action</th></tr></thead><tbody>${list.map(s=>`<tr><td>${person(s)}</td><td><span class="badge ${archived?'':'present'}">${archived?'Archived':'Active'}</span></td><td><button class="row-action" data-archive="${s.id}">${archived?'Restore student':'Archive student'}</button></td></tr>`).join('')||'<tr><td colspan="3" class="empty">No students found.</td></tr>'}</tbody></table></div></div>`}
function classPage(){return heading('<em>Classes</em>','Each workshop has its own date and attendance record.')+`<form class="panel" id="class-form"><h2 style="margin-bottom:22px">Create a workshop</h2><div class="fields"><div class="field"><label for="class-title">Workshop title</label><input id="class-title" name="title" required maxlength="100" placeholder="e.g. Prompting with AI"></div><div class="field"><label for="class-date">Workshop date</label><input id="class-date" name="date" type="date" required value="2026-10-09"></div></div><p class="error" id="form-error" role="alert" hidden></p><button class="btn primary" type="submit">Create workshop</button></form><div class="class-grid">${classes.map(c=>`<article class="class-card"><span class="tag">Workshop · ${esc(c.date)}</span><h2>${esc(c.title)}</h2><p>${active().length} active students</p><button class="btn" data-open-class="${c.id}">Fill attendance →</button></article>`).join('')}</div>`}
function report(){return heading('My Class <em>Reports</em>','Review attendance totals and download the full active roster.','<button class="btn primary" data-export>↓ Export CSV</button>')+`<div class="banner"><div><span class="tag">Workshop report</span><h2>${esc(classes.find(c=>c.id===selectedClass).title)}</h2></div>${classSelect()}</div>`+stats()+`<div class="panel"><h2>Attendance summary</h2><p style="margin-top:14px">${active().filter(s=>status(s)==='unmarked').length} students remain unmarked. CSV exports include every active student, regardless of search or filters.</p><div class="form-actions"><button class="btn" data-page="attendance">Review attendance</button></div></div>`}
function admin(){return heading('Admin <em>View</em>','An overview of this attendance workspace.')+`<div class="stats">${[['Workshops',classes.length],['Active students',active().length],['Archived students',students.filter(s=>s.archived).length],['Mail drafts',drafts.length]].map(([n,v])=>`<div class="stat"><b>${v}</b><span>${n}</span></div>`).join('')}</div><div class="panel"><h2>Workspace details</h2><div class="table-wrap"><table style="margin-top:20px"><tbody><tr><th>Organizer</th><td>Rakesh Bhugra</td></tr><tr><th>Mode</th><td>UI prototype with temporary sample data</td></tr><tr><th>Student roster</th><td>Shared across workshops in this preview</td></tr><tr><th>Permissions</th><td>Organizer accounts and access controls are future additions.</td></tr></tbody></table></div></div>`}
function mails(){return heading('<em>Mails</em>','Prepare a workshop message. This preview saves drafts only.')+`<form class="panel form" id="mail-form"><div class="field"><label for="mail-to">Recipients</label><select id="mail-to" name="to"><option>All active students</option><option>Present students in selected workshop</option><option>Absent students in selected workshop</option></select></div><div class="field"><label for="mail-subject">Subject</label><input id="mail-subject" name="subject" required maxlength="160" placeholder="Workshop follow-up"></div><div class="field"><label for="mail-body">Message</label><textarea id="mail-body" name="body" required maxlength="5000" placeholder="Write your message…"></textarea></div><p class="error" id="form-error" role="alert" hidden></p><p>Selected workshop: ${esc(classes.find(c=>c.id===selectedClass).title)}. No emails are sent.</p><div class="form-actions"><button class="btn primary" type="submit">Save draft</button></div></form><div class="panel" style="margin-top:24px"><h2>Drafts (${drafts.length})</h2>${drafts.map(d=>`<article class="draft"><strong>${esc(d.subject)}</strong><small>${esc(d.to)} · ${esc(d.workshop)} · ${d.count} recipients</small><p>${esc(d.body)}</p></article>`).join('')||'<p style="margin-top:16px">Your saved drafts will appear here.</p>'}</div>`}
function render(){nav();main.innerHTML=`<div class="breadcrumb">Attendance Management / ${['add','active','archive'].includes(page)?'Student Details / ':''}<span>${labels[page]}</span></div>`+({attendance:fillAttendance,classes:classPage,add:studentForm,active:()=>studentList(false),archive:()=>studentList(true),admin:admin,reports:report,mails:mails}[page])()+`<div class="note">Preview only · Changes reset when you reload this page.</div>`}
function navigate(p){page=p;query='';filter='all';if(['add','active','archive'].includes(p))groupOpen=true;closeMenu();render();main.focus()}
function closeMenu(){document.querySelector('#sidebar').classList.remove('open');document.querySelector('#overlay').classList.remove('show');document.querySelector('#mobile-toggle').setAttribute('aria-expanded','false')}
function notify(message){const el=document.querySelector('#toast');el.textContent=message;el.hidden=false;clearTimeout(timer);timer=setTimeout(()=>el.hidden=true,3000)}
function error(message){const el=document.querySelector('#form-error');el.textContent=message;el.hidden=false}
function exportCSV(){const c=classes.find(c=>c.id===selectedClass);const cell=s=>'"'+String(s).replaceAll('"','""')+'"';const csv=[['Workshop','Date','Name','Email','Attendance'],...active().map(s=>[c.title,c.date,s.name,s.email,status(s)])].map(r=>r.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='workshop-attendance.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Attendance CSV downloaded')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)navigate(b.dataset.page);else if(b.id==='student-group'){groupOpen=!groupOpen;nav();document.querySelector('#student-group').focus()}else if(b.dataset.status){const id=Number(b.dataset.id),value=b.dataset.status;attendance[selectedClass][id]=attendance[selectedClass][id]===value?'unmarked':value;render();const updated=main.querySelector(`[data-id="${id}"][data-status="${value}"]`);if(updated)updated.focus();notify('Attendance updated in this preview')}else if(b.dataset.filter){filter=b.dataset.filter;render();main.querySelector(`[data-filter="${filter}"]`).focus()}else if(b.dataset.archive){const s=students.find(s=>s.id===Number(b.dataset.archive));s.archived=!s.archived;render();notify(s.archived?'Student archived':'Student restored')}else if(b.dataset.openClass){selectedClass=Number(b.dataset.openClass);navigate('attendance')}else if(b.hasAttribute('data-export'))exportCSV();else if(b.id==='mobile-toggle'){const open=document.querySelector('#sidebar').classList.toggle('open');document.querySelector('#overlay').classList.toggle('show',open);b.setAttribute('aria-expanded',String(open))}});
main.addEventListener('input',e=>{if(e.target.matches('.search')){query=e.target.value;render();main.querySelector('.search').focus()}});
main.addEventListener('change',e=>{if(e.target.id==='class-select'){selectedClass=Number(e.target.value);query='';filter='all';render();main.querySelector('#class-select').focus()}});
main.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.target);if(e.target.id==='student-form'){const name=data.get('name').trim(),email=data.get('email').trim().toLowerCase();if(!name)return error('Enter a student name.');if(students.some(s=>s.email.toLowerCase()===email))return error('This email is already in the active or archived roster.');students.push({id:Math.max(0,...students.map(s=>s.id))+1,name,email,archived:false});navigate('active');notify('Student added to the active roster')}else if(e.target.id==='class-form'){const title=data.get('title').trim(),date=data.get('date');if(!title)return error('Enter a workshop title.');const id=Math.max(...classes.map(c=>c.id))+1;classes.push({id,title,date});attendance[id]={};selectedClass=id;render();notify('Workshop created')}else if(e.target.id==='mail-form'){const subject=data.get('subject').trim(),body=data.get('body').trim(),to=data.get('to');if(!subject||!body)return error('Enter a subject and message.');const audience=active().filter(s=>to.startsWith('Present')?status(s)==='present':to.startsWith('Absent')?status(s)==='absent':true);drafts.unshift({subject,body,to,workshop:classes.find(c=>c.id===selectedClass).title,count:audience.length});render();notify('Draft saved. No email was sent.')}});
document.querySelector('#overlay').addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();document.querySelector('#mobile-toggle').focus()}});
document.querySelector('#mobile-toggle').innerHTML=icon('menu');render();
</script>
</body>
</html>
