<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshop attendance · 5 UI ideas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b0b0d;color:#eee}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #a998ff;outline-offset:3px}.gallery{padding:26px 36px 20px;border-bottom:1px solid #303034}.gallery-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#a6a6b1;font-weight:600}h1{font-size:25px;letter-spacing:-.8px;margin:7px 0}.gallery p{font-size:13px;color:#aaaab3;margin:5px 0 18px}.prd{color:#ccc;font-size:12px;text-decoration:none;border:1px solid #39393e;padding:9px 13px;border-radius:7px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.tab{text-align:left;padding:12px 15px;color:#b8b8c1;background:#17171c;border:1px solid #323238;border-radius:8px}.tab span{display:block;font-size:10px;color:#90909c;margin-bottom:5px;letter-spacing:1px}.tab.active{background:#ececf1;color:#17171c;border-color:#fff}.tab.active span{color:#62626c}.concept-info{display:flex;align-items:center;gap:14px;padding:17px 36px;color:#b4b4bf;font-size:13px}.concept-info strong{color:#eee}.demo-badge{font-size:10px;letter-spacing:1px;border:1px solid #45454c;border-radius:4px;padding:4px 7px;white-space:nowrap}.preview{margin:0 28px 28px;min-height:660px;border-radius:12px;overflow:hidden;--bg:#f6f7fb;--panel:#fff;--ink:#222735;--muted:#748093;--line:#e5e8ef;--accent:#6754ce;--soft:#f0ecff;--yes:#237857;--yesbg:#e9f6ef;--no:#b34c4c;--nobg:#fff0ef;background:var(--bg);color:var(--ink);font-size:14px}.preview h2{font-size:30px;letter-spacing:-1px;margin:8px 0 10px}.preview h3{margin:0;font-size:16px}.preview p{color:var(--muted);line-height:1.6}.label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600}.brand{font-size:20px;font-weight:700;letter-spacing:-.6px}.brand-mark{display:inline-grid;place-items:center;background:var(--accent);color:#fff;width:31px;height:31px;border-radius:9px;margin-right:9px}.btn{padding:10px 15px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:12px;font-weight:600}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:25px 0 17px}.search{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:11px 14px;border-radius:7px;min-width:260px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:1px solid var(--line);padding:8px 13px;border-radius:6px;background:var(--panel);color:var(--muted);font-size:12px}.filter.active{background:var(--soft);color:var(--accent);border-color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0}.stat{background:var(--panel);border:1px solid var(--line);padding:19px;border-radius:9px}.stat b{font-size:28px;display:block;margin-top:8px;font-weight:600}.stat span{font-size:11px;color:var(--muted)}.table-shell{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}th{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:14px 19px;background:var(--bg)}td{padding:15px 19px;border-top:1px solid var(--line)}.person{display:flex;align-items:center;gap:12px}.avatar{display:grid;place-items:center;flex-shrink:0;width:35px;height:35px;background:var(--soft);color:var(--accent);border-radius:50%;font-size:11px;font-weight:600}.person small{display:block;font-size:11px;color:var(--muted);margin-top:5px}.status{font-size:11px;border-radius:20px;padding:5px 10px;background:var(--bg);color:var(--muted)}.status.present{color:var(--yes);background:var(--yesbg)}.status.absent{color:var(--no);background:var(--nobg)}.mark{padding:7px 10px;border:1px solid var(--line);border-radius:5px;font-size:11px;background:var(--panel);color:var(--muted);margin:0 3px}.mark.selected[data-status=present]{background:var(--yesbg);border-color:var(--yes);color:var(--yes)}.mark.selected[data-status=absent]{background:var(--nobg);border-color:var(--no);color:var(--no)}.footnote{font-size:11px;color:var(--muted);margin-top:18px}.head-row{display:flex;justify-content:space-between;align-items:center;gap:15px}.empty{text-align:center;padding:40px;color:var(--muted)}
/* 01: permanent navigation and a generous full roster */
.roster{display:grid;grid-template-columns:210px 1fr}.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:30px 22px}.sidebar .brand{margin-bottom:48px}.side-item{padding:13px;margin:5px 0;color:var(--muted);font-size:12px}.side-item.current{background:var(--soft);color:var(--accent);border-radius:7px;font-weight:600}.side-bottom{margin-top:190px;border-top:1px solid var(--line);padding-top:20px}.roster-main{padding:32px}.crumb{font-size:11px;color:var(--muted);margin-bottom:28px}
/* 02: wide breathing room and large thumb targets */
.cards{--bg:#f6f5f0;--accent:#247354;--soft:#e6eee5;--ink:#203b30;--muted:#728278;--line:#dedfd5}.card-header{padding:20px 36px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.cards-main{max-width:980px;margin:auto;padding:30px}.session-banner{background:#244c3b;color:#fff;border-radius:14px;padding:27px 30px;display:flex;justify-content:space-between;align-items:center}.session-banner h2{font-size:29px}.session-banner p,.session-banner .label{color:#c9ddcf}.session-number{text-align:right}.session-number b{font-size:44px;display:block}.session-number span{font-size:12px;color:#c9ddcf}.card-list{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.participant-card{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:20px}.participant-card .person{margin-bottom:18px}.participant-card .mark{width:calc(50% - 7px);padding:13px 5px;margin-top:15px;font-size:12px}.cards .search{flex:1}.cards .stats{gap:8px}.cards .stat{padding:13px}.cards .stat b{font-size:23px}
/* 03: check-in desk with a focus panel */
.desk{--bg:#f1f4f7;--accent:#235b92;--soft:#e7eff8;--ink:#253b50;--line:#dee5ec}.desk-header{padding:22px 32px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.desk-main{padding:30px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(290px,.75fr);gap:28px}.queue{border:1px solid var(--line);background:var(--panel);border-radius:9px;overflow:hidden}.queue-row{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:17px 20px;border:0;border-bottom:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%;text-align:left}.queue-row.focus{background:var(--soft);box-shadow:inset 3px 0 var(--accent)}.focus-card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:30px;align-self:start;margin-top:8px;text-align:center}.focus-card .avatar{width:80px;height:80px;font-size:25px;margin:28px auto 20px}.focus-card h2{font-size:25px}.focus-card .mark{width:100%;padding:16px;margin:7px 0;font-size:14px}.desk .stats{margin:22px 0;grid-template-columns:repeat(3,1fr)}.desk .stat{padding:15px}.desk .search{width:100%;min-width:0}.desk .toolbar{display:block}.desk .filters{margin-top:12px}
/* 04: dense monochrome command center */
.command{--bg:#101113;--panel:#18191c;--ink:#eeeeef;--muted:#a3a3ad;--line:#303237;--accent:#e2e2e7;--soft:#2c2d32;--yes:#eee;--yesbg:#36383c;--no:#bbb;--nobg:#222326;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.command-top{padding:19px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.command .brand{font-size:16px}.command .brand-mark{background:#ddd;color:#111;border-radius:3px}.command-main{padding:27px 32px}.command .primary{color:#111}.command h2{font-size:26px}.command .stat{border-radius:2px;border:0;border-right:1px solid var(--line);background:transparent}.command .stats{border:1px solid var(--line);gap:0}.command .avatar{border-radius:4px}.command .table-shell,.command .search,.command .btn,.command .filter{border-radius:3px}.command td{padding:12px 19px}.command .status{border-radius:2px;border:1px solid var(--line)}.command .status.absent{border-style:dashed}.command .mark{border-radius:2px}.command .footnote{border-top:1px solid var(--line);padding-top:18px}.command .label{letter-spacing:1px}
/* 05: editorial register with rows and margin notes */
.notebook{--bg:#f5f1e8;--panel:#fcfaf5;--ink:#35332e;--muted:#817b6f;--line:#dcd5c7;--accent:#665646;--soft:#ece5d8;--yes:#435842;--yesbg:#e6ecdf;--no:#805345;--nobg:#f0e3db}.notebook-main{max-width:1040px;margin:auto;padding:32px 40px}.notebook-top{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:20px}.notebook .brand{font-family:Georgia,serif;font-size:25px;font-weight:400}.notebook h2{font-family:Georgia,serif;font-size:42px;font-weight:400;letter-spacing:-1.5px}.notebook-layout{display:grid;grid-template-columns:1fr 190px;gap:28px;margin-top:26px}.margin-note{border-left:1px solid var(--line);padding-left:22px}.notebook .stats{display:block;margin:20px 0}.notebook .stat{background:transparent;border:none;border-bottom:1px solid var(--line);padding:15px 0;border-radius:0}.notebook .stat b{font-family:Georgia,serif;font-size:32px;font-weight:400}.notebook .table-shell{border:0;border-radius:0;background:transparent}.notebook th{background:transparent;border-bottom:2px solid var(--ink)}.notebook td{padding:18px 8px}.notebook th{padding:12px 8px}.notebook .toolbar{margin:0 0 20px;flex-wrap:wrap}.notebook .search{background:transparent;border-radius:0;border-width:0 0 1px;padding-left:0;min-width:210px}.notebook .mark{border-radius:50%;height:32px;width:32px;padding:0}.notebook .avatar{display:none}.notebook .btn{border-radius:0}.notebook .filter{border:0;border-radius:0;background:transparent;padding-left:0;padding-right:15px}.notebook .filter.active{background:transparent;text-decoration:underline;text-underline-offset:6px}.notebook .status{background:transparent;padding-left:0}.notebook .person small{font-size:10px}.notebook .footnote{font-family:Georgia,serif;font-style:italic;font-size:13px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#fff;color:#17171c;box-shadow:0 5px 30px #0005;border-radius:8px;font-size:13px;z-index:10}.toast[hidden]{display:none}
@media(max-width:1000px){.roster{grid-template-columns:160px 1fr}.sidebar{padding:25px 14px}.roster-main{padding:24px}.card-list{grid-template-columns:repeat(2,1fr)}.toolbar{flex-wrap:wrap}.notebook-main{padding:28px}.notebook-layout{grid-template-columns:1fr 150px}.desk-main{gap:18px;padding:22px}.tabs{gap:5px}.tab{padding:10px}}
@media(max-width:700px){.gallery{padding:22px 18px}.gallery-head{align-items:flex-start}.gallery h1{font-size:21px}.tabs{grid-template-columns:repeat(2,1fr)}.tabs .tab:last-child{grid-column:span 2}.concept-info{padding:15px 18px;align-items:flex-start;line-height:1.5}.preview{margin:0 10px 20px}.roster{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:18px;display:flex;align-items:center;gap:12px}.sidebar .brand{margin:0}.side-item,.side-bottom{display:none}.roster-main,.command-main,.cards-main{padding:22px 16px}.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:14px}.head-row{align-items:flex-start}.preview h2{font-size:26px}.search{min-width:0;width:100%}.card-header,.desk-header{padding:18px}.session-banner{padding:22px 18px}.session-number b{font-size:32px}.card-list{grid-template-columns:1fr}.cards .stats{grid-template-columns:repeat(4,1fr)}.cards .stat{padding:9px}.cards .stat b{font-size:21px}.desk-main{grid-template-columns:1fr}.focus-card{margin-top:0;grid-row:1;padding:20px}.focus-card .avatar{margin:15px auto;width:50px;height:50px;font-size:17px}.desk .stats{grid-template-columns:repeat(3,1fr)}.desk-header span:last-child{font-size:11px}.command-top{padding:18px 16px}.notebook-main{padding:22px 16px}.notebook-layout{grid-template-columns:1fr}.margin-note{border:0;padding:0;grid-row:1}.notebook .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0}.notebook .stat{padding:5px 0 12px}.margin-note>.label,.margin-note>p{display:none}.notebook h2{font-size:33px}.notebook-top{gap:10px}.notebook-top .label{font-size:8px}.gallery-head .prd{white-space:nowrap;font-size:10px}.concept-info strong{display:block}}
</style>
</head>
<body>
<header class="gallery"><div class="gallery-head"><div><div class="eyebrow">Workshop attendance / design exploration</div><h1>One simple app. Five directions.</h1></div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="prd" href="schoolnet.html">Schoolnet + submenus ↗</a><a class="prd" href="../workshop-attendance-prd.html">View PRD ↗</a></div></div><p>Explore the layouts. Try search, filters, and attendance marking. All data is fictional and resets when you switch ideas.</p><nav class="tabs" aria-label="UI concepts"></nav></header>
<div class="concept-info" aria-live="polite"><span class="demo-badge">UI PROTOTYPE</span><div id="description"></div></div>
<main class="preview" id="preview"></main><div class="toast" role="status" hidden></div>
<script>
const ideas=[{name:'Roster dashboard',tag:'01 / STRUCTURED',cls:'roster',desc:'A familiar sidebar and full participant table. Best for organizers working on a laptop.'},{name:'Pocket attendance',tag:'02 / MOBILE FIRST',cls:'cards',desc:'Large participant cards and thumb-friendly actions. Best for walking around the room.'},{name:'Check-in desk',tag:'03 / FOCUSED',cls:'desk',desc:'A searchable queue with one participant in focus. Best for welcoming people at the door.'},{name:'Command view',tag:'04 / COMPACT',cls:'command',desc:'A dense, monochrome register with minimal chrome. Best for fast scanning and repeat use.'},{name:'Workshop notebook',tag:'05 / EDITORIAL',cls:'notebook',desc:'A warm paper-like register with margin totals. Best for a calm, familiar attendance experience.'}];
const seed=[['Aarav Mehta','aarav@example.com','present'],['Diya Shah','diya@example.com','present'],['Ishaan Rao','ishaan@example.com','unmarked'],['Kavya Iyer','kavya@example.com','unmarked'],['Neha Kapoor','neha@example.com','absent'],['Rohan Joshi','rohan@example.com','unmarked']];
let current=0,people=[],query='',filter='all',focus=2,timer;
const preview=document.querySelector('#preview');
function initials(name){return name.split(' ').map(n=>n[0]).join('')}
function person(p){return `<div class="person"><span class="avatar">${initials(p.name)}</span><div><strong>${p.name}</strong><small>${p.email}</small></div></div>`}
function badge(p){return `<span class="status ${p.status}">${p.status[0].toUpperCase()+p.status.slice(1)}</span>`}
function actions(p,short=false){return `<button class="mark ${p.status==='present'?'selected':''}" data-id="${p.id}" data-status="present" aria-label="Mark ${p.name} present" aria-pressed="${p.status==='present'}">${short?'✓':'✓ Present'}</button><button class="mark ${p.status==='absent'?'selected':''}" data-id="${p.id}" data-status="absent" aria-label="Mark ${p.name} absent" aria-pressed="${p.status==='absent'}">${short?'×':'× Absent'}</button>`}
function stats(skipTotal=false){return `<div class="stats">${(skipTotal?['present','absent','unmarked']:['total','present','absent','unmarked']).map(s=>`<div class="stat"><span>${s[0].toUpperCase()+s.slice(1)}</span><b>${s==='total'?people.length:people.filter(p=>p.status===s).length}</b></div>`).join('')}</div>`}
function filters(){return `<div class="filters">${['all','present','absent','unmarked'].map(f=>`<button class="filter ${filter===f?'active':''}" data-filter="${f}" aria-pressed="${filter===f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div>`}
function search(){return `<input class="search" type="search" aria-label="Search participants" placeholder="Search name or email…" value="">`}
function filtered(){return people.filter(p=>(filter==='all'||p.status===filter)&&(p.name+' '+p.email).toLowerCase().includes(query.toLowerCase()))}
function table(short=false){const rows=filtered();return `<div class="table-shell"><table><thead><tr><th>Participant</th><th>Status</th><th>Attendance</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${person(p)}</td><td>${badge(p)}</td><td>${actions(p,short)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">No matching participants.</td></tr>'}</tbody></table></div>`}
const exportButton='<button class="btn primary" data-export>↓ Export CSV</button>';
const note='<div class="footnote">Sample workshop · 6 participants · Prototype changes are temporary</div>';
function render(){
 const idea=ideas[current]; preview.className='preview '+idea.cls;
 if(current===0)preview.innerHTML=`<aside class="sidebar"><div class="brand"><span class="brand-mark">a</span>attend</div><div class="label">Workspace</div><div class="side-item">Overview</div><div class="side-item current">▦ Workshops</div><div class="side-bottom"><div class="person"><span class="avatar">RB</span><div>Rakesh<small>Organizer</small></div></div></div></aside><div class="roster-main"><div class="crumb">Workshops / AI fundamentals</div><div class="head-row"><div><div class="label">Friday, 09 October 2026</div><h2>AI fundamentals</h2><p>A practical introduction to working with AI.</p></div>${exportButton}</div>${stats()}<div class="toolbar">${search()}${filters()}</div>${table()}${note}</div>`;
 if(current===1)preview.innerHTML=`<div class="card-header"><div class="brand"><span class="brand-mark">✓</span>Gather</div>${exportButton}</div><div class="cards-main"><div class="session-banner"><div><div class="label">Your workshop · 09 Oct</div><h2>AI fundamentals</h2><p>A small group. A big first step.</p></div><div class="session-number"><b>${people.filter(p=>p.status==='present').length}/${people.length}</b><span>here today</span></div></div>${stats()}<div class="toolbar">${search()}</div><div class="toolbar">${filters()}</div><div class="card-list">${filtered().map(p=>`<article class="participant-card">${person(p)}${badge(p)}<div>${actions(p)}</div></article>`).join('')||'<div class="empty">No matching participants.</div>'}</div>${note}</div>`;
 if(current===2){const p=people.find(p=>p.id===focus);preview.innerHTML=`<div class="desk-header"><div class="brand"><span class="brand-mark">↗</span>Check-in desk</div><span class="label">AI fundamentals · 09 Oct 2026</span></div><div class="desk-main"><div><div class="label">Workshop roster</div><h2>Welcome everyone in.</h2>${stats(true)}<div class="toolbar">${search()}${filters()}</div><div class="queue">${filtered().map(p=>`<button class="queue-row ${p.id===focus?'focus':''}" data-focus="${p.id}" aria-pressed="${p.id===focus}">${person(p)}${badge(p)}</button>`).join('')||'<div class="empty">No matching participants.</div>'}</div>${note}</div><aside class="focus-card"><div class="label">Selected participant</div><span class="avatar">${initials(p.name)}</span><h2>${p.name}</h2><p>${p.email}</p>${badge(p)}<div style="margin-top:23px">${actions(p)}</div><p>Choose a name from the roster to mark their attendance.</p>${exportButton}</aside></div>`;}
 if(current===3)preview.innerHTML=`<div class="command-top"><div class="brand"><span class="brand-mark">_</span>ATTEND / CONSOLE</div><span class="label">DEMO SESSION</span></div><div class="command-main"><div class="head-row"><div><div class="label">WORKSHOP_001 / 2026-10-09</div><h2>AI fundamentals</h2></div>${exportButton}</div>${stats()}<div class="toolbar">${search()}${filters()}</div>${table()}<div class="footnote">${filtered().length} RECORDS VISIBLE / ${people.length} TOTAL · CLICK A SELECTED STATUS TO CLEAR IT</div></div>`;
 if(current===4)preview.innerHTML=`<div class="notebook-main"><div class="notebook-top"><div class="brand">The workshop register.</div><div class="label">No. 001<br>09 October 2026</div></div><div class="head-row" style="margin-top:28px"><div><div class="label">Attendance sheet</div><h2>AI fundamentals</h2></div>${exportButton}</div><div class="notebook-layout"><div><div class="toolbar">${search()}${filters()}</div>${table(true)}<div class="footnote">✓ present &nbsp; × absent · Tap again to leave unmarked.</div></div><aside class="margin-note"><div class="label">At a glance</div>${stats()}<p>Every person counts.</p></aside></div>${note}</div>`;
 preview.querySelectorAll('.search').forEach(i=>i.value=query);
}
function select(index){current=index;query='';filter='all';focus=2;people=seed.map((p,id)=>({id,name:p[0],email:p[1],status:p[2]}));document.querySelector('.tabs').innerHTML=ideas.map((i,n)=>`<button class="tab ${n===current?'active':''}" data-concept="${n}" aria-pressed="${n===current}"><span>${i.tag}</span>${i.name}</button>`).join('');document.querySelector('#description').innerHTML=`<strong>${ideas[index].name}.</strong> ${ideas[index].desc}`;render()}
function toast(message){const el=document.querySelector('.toast');el.textContent=message;el.hidden=false;clearTimeout(timer);timer=setTimeout(()=>el.hidden=true,2500)}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.concept!==undefined)select(Number(t.dataset.concept));else if(t.dataset.status){const p=people.find(p=>p.id===Number(t.dataset.id));p.status=p.status===t.dataset.status?'unmarked':t.dataset.status;render();toast(`${p.name}: ${p.status}`)}else if(t.dataset.filter){filter=t.dataset.filter;render()}else if(t.dataset.focus){focus=Number(t.dataset.focus);render()}else if(t.hasAttribute('data-export')){const cells=s=>'"'+String(s).replaceAll('"','""')+'"';const csv=[['Workshop','Date','Name','Email','Attendance'],...people.map(p=>['AI fundamentals','2026-10-09',p.name,p.email,p.status])].map(r=>r.map(cells).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='sample-workshop-attendance.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Sample attendance CSV exported')}});
preview.addEventListener('input',e=>{if(!e.target.matches('.search'))return;query=e.target.value;const pos=e.target.selectionStart;render();const input=preview.querySelector('.search');input.focus();try{input.setSelectionRange(pos,pos)}catch{}});
select(0);
</script>
</body>
</html>
